; ============================================================================
;  Massmore MAX3010x (SKU-0026) - โปรเจกต์ PlatformIO
;  บอร์ดเซ็นเซอร์วัดออกซิเจนในเลือดและการเต้นหัวใจ MAX30102
;  https://www.massmore.shop
;
;  วิธีใช้
;    1. เปิดโฟลเดอร์ PlatformIO/ นี้ด้วย VS Code (ต้องมีส่วนขยาย PlatformIO IDE)
;    2. เลือกตัวอย่างที่ต้องการจาก examples/ แล้วคัดลอกทับ src/main.cpp
;    3. กด Upload
;
;  หมายเหตุเรื่องเวอร์ชัน ESP32 core
;    platform "espressif32" ตัวทางการยังส่ง Arduino core 2.0.x อยู่
;    จึงใช้ pioarduino fork ที่ pin ไว้ตายตัวเพื่อให้ได้ core 3.x เหมือน
;    Arduino IDE รุ่นล่าสุด และให้ผลการ build ซ้ำได้เสมอ
;      55.03.311  =  Arduino ESP32 core 3.3.11
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ความเร็วอัปโหลด
;   512000 คือค่าที่ใช้กับบอร์ด Massmore บน macOS ได้นิ่งที่สุด
;   ถ้าอัปโหลดไม่ผ่าน (Timed out waiting for packet header) ให้ลด 460800 หรือ 115200
upload_speed = 512000

build_flags =
    -Wall
    -Wextra
    ; ขา I2C ปริยายของบอร์ด Massmore ESP32 Breakout (Qwiic)
    -D MASSMORE_MAX3010X_SDA_PIN=21
    -D MASSMORE_MAX3010X_SCL_PIN=22

lib_deps =

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-s2-saola-1]
board = esp32-s2-saola-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1
