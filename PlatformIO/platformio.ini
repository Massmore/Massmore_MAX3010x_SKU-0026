; Massmore_MAX3010x — PlatformIO multi-target project
; เปิดโฟลเดอร์นี้ใน VS Code แล้ว Build ได้ทันที ไม่ต้องติดตั้งอะไรเพิ่ม
; src/main.cpp = 05_Factory_Test (คัดลอก example อื่นมาทับได้)

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
; ไลบรารีอยู่ใน lib/Massmore_MAX3010x แล้ว — ไม่ใช้ lib_deps จาก registry

; ---------- ESP32 family: pin pioarduino เพื่อให้ได้ Arduino-ESP32 Core 3.x ----------
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
upload_speed = 921600          ; ค่าหลักสำหรับ Mac
; upload_speed = 512000        ; ทางเลือก ถ้าอัพโหลดไม่นิ่ง
; upload_speed = 460800        ; ทางเลือก ถ้ายังไม่นิ่ง
monitor_filters = esp32_exception_decoder

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; Massmore MOMO ESP32-S3 (16 MB flash, 8 MB PSRAM) — ต่อ Serial ผ่านชิป USB-UART (CH343)
; จึงต้องปิด USB CDC On Boot ไม่อย่างนั้น Serial จะไปออกที่ native USB แทน
; I2C ของบอร์ด: SDA = GPIO 14, SCL = GPIO 15 (กำหนดใน example)
[env:massmore-momo-esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; ---------- AVR: Arduino Nano (ATmega328P) ----------
[env:nano]
platform = atmelavr
board = nanoatmega328new     ; Nano ที่ใช้ bootloader ใหม่ (115200) — บอร์ดส่วนใหญ่ในปัจจุบัน
; board = nanoatmega328      ; ทางเลือก: Nano ที่ใช้ bootloader เก่า (57600) ถ้าอัพโหลดไม่ขึ้น
